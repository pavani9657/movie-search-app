<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Movie Search App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-box">
    <h1>🎬 Movie Search</h1>
    <h2 id="auth-title">Welcome Back!</h2>

    <form id="auth-form">
      <div id="name-group" class="form-group hidden">
        <label for="auth-name">Name</label>
        <input type="text" id="auth-name" placeholder="Your name" />
      </div>

      <div class="form-group">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="Enter your email" required />
      </div>

      <div class="form-group">
        <label for="auth-password">Password</label>
        <input
          type="password"
          id="auth-password"
          placeholder="Minimum 6 characters"
          required
        />
      </div>

      <p id="auth-error" class="auth-error"></p>
      <button type="submit" id="auth-submit">Login</button>
    </form>

    <p class="auth-switch">
      <span id="auth-switch-text">New here?</span>
      <button type="button" id="auth-toggle">Create an account</button>
    </p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
